<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ضربان شو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--c1:#1b1464;--c2:#4b1d8f;--gold:#ffc83d;--blue:#3aa8ff;--ok:#34d399;--bad:#f87171;--card:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));min-height:100vh;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
#app{max-width:480px;margin:0 auto;padding:16px 0 24px;display:flex;flex-direction:column;gap:14px}
.logo{text-align:center;font-weight:900;font-size:40px;color:var(--gold);text-shadow:0 4px 0 #7a3e00;margin-top:8px}
.card{background:var(--card);border-radius:18px;padding:14px}
.bar{display:flex;justify-content:space-between;font-size:15px;font-weight:700;gap:8px;flex-wrap:wrap}
button{font-family:inherit;border:0;border-radius:16px;color:#1b1464;background:var(--gold);font-weight:900;font-size:17px;padding:13px;cursor:pointer;box-shadow:0 5px 0 #b57f00}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b57f00}
button:disabled{opacity:.4}
button.alt{background:var(--blue);color:#fff;box-shadow:0 5px 0 #1d6fb0}
button.red{background:var(--bad);color:#fff;box-shadow:0 5px 0 #a33c3c}
button.ghost{background:transparent;color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.4);font-size:15px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{font-family:inherit;width:100%;padding:12px;border-radius:12px;border:0;font-size:16px;text-align:right}
.stars{font-size:14px;color:var(--gold)}
.q{font-size:44px;font-weight:900;text-align:center;padding:14px 0;direction:ltr;unicode-bidi:isolate}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans button{background:#fff;color:#1b1464;box-shadow:0 5px 0 #b9b9c9;font-size:26px;padding:16px 0}
.ans button.ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 #15865c}
.ans button.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 #a33c3c}
.fb{text-align:center;font-size:19px;font-weight:900;min-height:30px;margin-top:8px}
.mascot{width:100%;margin:0 auto;animation:float 2.4s ease-in-out infinite}
canvas.viz{width:100%;height:110px;display:block}
.cube{width:100px;height:100px;margin:10px auto;position:relative;transform-style:preserve-3d;animation:spin 8s linear infinite}
.cube .f{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;border-radius:18px;background:linear-gradient(145deg,#1c1c22,#050507);border:2px solid #d4a24c;box-shadow:0 0 18px #ffb84d66,inset 0 0 20px #ffb84d22}
.cube .f:nth-child(1){transform:rotateY(0deg) translateZ(50px)}
.cube .f:nth-child(2){transform:rotateY(90deg) translateZ(50px)}
.cube .f:nth-child(3){transform:rotateY(180deg) translateZ(50px)}
.cube .f:nth-child(4){transform:rotateY(270deg) translateZ(50px)}
@keyframes spin{to{transform:rotateY(360deg)}}
.mascot.win{animation:jump .6s}
.mascot.lose{animation:shake .5s}
@keyframes float{50%{transform:translateY(-8px) rotateY(12deg)}}
@keyframes jump{30%{transform:translateY(-30px) scale(1.15)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.timer{height:10px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden}
.timer div{height:100%;background:var(--gold);transition:width .9s linear}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.15);font-weight:700;direction:rtl}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.lock{opacity:.5}
footer{text-align:center;font-size:13px;opacity:.75;padding-top:6px}
</style>
</head>
